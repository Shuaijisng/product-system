<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品未找到</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>
    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="glass-card text-center" style="max-width: 600px; width: 100%; padding: 60px 40px;">
            <div style="font-size: 6rem; font-weight: 800; color: var(--primary-color); opacity: 0.2; line-height: 1;">
                404</div>
            <h2 class="mb-4" style="color: var(--primary-color); font-size: 2rem;">产品未找到</h2>

            <div style="margin-bottom: 30px; color: var(--text-secondary); font-size: 1.1rem;">
                抱歉，系统未能找到款号为 <strong
                    style="color: var(--danger); background: rgba(239, 68, 68, 0.1); padding: 2px 6px; border-radius: 4px;">{{
                    code }}</strong> 的产品信息。
            </div>

            <div style="padding: 20px; background: rgba(255,255,255,0.5); border-radius: 12px; margin-bottom: 30px;">
                <p style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 8px;">可能的原因：</p>
                <div
                    style="color: var(--text-secondary); font-size: 0.95rem; display: flex; flex-direction: column; gap: 4px; align-items: center;">
                    <span>• 款号输入错误</span>
                    <span>• 该产品已被删除</span>
                    <span>• 尚未录入该产品信息</span>
                </div>
            </div>

            <a href="/" class="btn">返回首页</a>
        </div>
    </div>
</body>

</html>
